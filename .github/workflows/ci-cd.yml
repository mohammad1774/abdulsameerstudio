name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint HTML, CSS, and JavaScript
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:browser

      - name: Upload tested production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://abdulsameerstudio.ca
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Check deployment configuration
        id: deployment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID}" && -n "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "ready=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Cloudflare deployment skipped: configure the production environment credentials, then run this workflow again."
          fi

      - name: Check out repository
        if: steps.deployment.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        if: steps.deployment.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment dependencies
        if: steps.deployment.outputs.ready == 'true'
        run: npm ci

      - name: Download tested production site
        if: steps.deployment.outputs.ready == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-dist-${{ github.sha }}
          path: dist

      - name: Deploy to Cloudflare
        if: steps.deployment.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare

      - name: Verify production deployment
        if: steps.deployment.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: https://abdulsameerstudio.ca
        run: npm run verify:deployment
