name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check formatting
        run: npm run format:check

      - name: Lint HTML, CSS, and JavaScript
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Run browser and accessibility tests
        run: npm run test:browser

      - name: Upload tested production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  deploy-production:
    name: Deploy production
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs:
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://abdulsameerstudio.ca
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Check deployment configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          missing=()

          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID environment variable")
          fi

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            missing+=("CLOUDFLARE_API_TOKEN environment secret")
          fi

          if (( ${#missing[@]} > 0 )); then
            printf -v missing_values '%s, ' "${missing[@]}"
            echo "::error::Cloudflare deployment is not configured. Add ${missing_values%, } to the production environment."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install deployment dependencies
        run: npm ci

      - name: Download tested production site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist-${{ github.sha }}
          path: dist

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare

      - name: Verify production deployment
        env:
          DEPLOYMENT_URL: https://abdulsameerstudio.ca
        run: npm run verify:deployment
